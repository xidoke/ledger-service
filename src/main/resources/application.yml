spring:
  application:
    name: ledger-service

  mvc:
    problemdetails:
      enabled: true # framework MVC exceptions render as RFC 7807 ProblemDetail

  # Datasource is env-var driven (no hardcoded credentials).
  # Local dev: Spring Boot's docker-compose support supplies connection
  # details from compose.yaml. Tests: Testcontainers @ServiceConnection.
  # Other envs: set SPRING_DATASOURCE_* (e.g. in prod/staging).
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate must never auto-generate DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# Bounded retry for optimistic-lock conflicts on money writes (ADR-0011). Capped attempts +
# exponential backoff with full jitter; exhaustion → HTTP 409. Tune per contention profile.
ledger:
  retry:
    max-attempts: 5
    base-backoff-millis: 25
    max-backoff-millis: 200
  idempotency:
    reaper:
      # PENDING rows are claims; a real request never runs this long, so anything older is a crash-orphan.
      pending-ttl: PT10M
      # COMPLETED rows replay responses within the client retry window (Stripe: 24h); reusable after.
      completed-ttl: PT24H
      # How often the sweep runs (delay between completions).
      interval: PT10M

# Console logs are emitted as ECS JSON (one JSON object per line); MDC entries
# such as correlationId become top-level fields. Spring Boot 3.4+ native — no
# logback-spring.xml or logstash encoder needed.
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  info:
    build:
      enabled: true
    java:
      enabled: true
