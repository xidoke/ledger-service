# Full local stack — Postgres + the containerized app — in one command:
#   docker compose -f compose.app.yaml up --build
#
# This file is invoked explicitly with -f on purpose. Both `docker compose` and
# Spring Boot auto-prefer compose.yaml, so naming this compose.app.yaml keeps it
# out of auto-discovery: the dev inner loop (`./mvnw spring-boot:run`, which uses
# the postgres-only compose.yaml) never starts the app container by accident.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      # No Docker socket inside the container; the app connects via the env vars
      # above, so disable Spring Boot's docker-compose management here.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
